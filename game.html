// ===================== MAP BUILD =====================
function buildMap(){
  const m=Array.from({length:MH},()=>new Array(MW).fill(TT.WALL));
  const fill=(x1,y1,x2,y2,t)=>{
    for(let y=Math.max(0,y1);y<=Math.min(MH-1,y2);y++)
      for(let x=Math.max(0,x1);x<=Math.min(MW-1,x2);x++) m[y][x]=t;
  };
  const set=(x,y,t)=>{if(x>=0&&x<MW&&y>=0&&y<MH)m[y][x]=t;};

  // ZONE 1: Starting Ruins (safe) — top-left
  fill(1,1,26,13,TT.PATH);
  fill(4,3,9,6,TT.WALL);set(6,3,TT.PATH);set(6,4,TT.PATH);set(6,5,TT.PATH);// open-front ruin
  fill(16,4,16,9,TT.WALL);set(16,6,TT.PATH);set(16,7,TT.PATH);// pillar
  fill(20,8,25,12,TT.WALL);set(22,8,TT.PATH);set(23,8,TT.PATH);// corner ruin
  set(3,2,TT.SAGE); set(13,2,TT.VENDOR); set(22,5,TT.CHEST);// NPC + starter chest

  // Corridor south to forest
  fill(10,13,14,20,TT.PATH);
  // Corridor east to swamp
  fill(26,5,32,9,TT.PATH);

  // ZONE 2: Ancient Forest — center-left, rows 20-42, cols 1-26
  fill(1,20,26,42,TT.GRASS);
  // Tree clusters
  fill(1,20,4,24,TT.TREE);fill(19,22,24,26,TT.TREE);
  fill(1,30,5,34,TT.TREE);fill(20,34,25,39,TT.TREE);
  fill(8,38,12,42,TT.TREE);
  // Tall grass
  fill(5,22,9,28,TT.TALL);fill(14,27,18,33,TT.TALL);fill(6,36,10,42,TT.TALL);
  // Internal path
  fill(10,20,14,42,TT.PATH);fill(1,26,9,29,TT.PATH);fill(15,36,20,39,TT.PATH);
  // Chests (hidden in trees/tall grass edges)
  set(3,27,TT.CHEST);set(22,38,TT.CHEST);
  // Boss1 area
  fill(6,42,20,46,TT.GRASS);set(13,44,TT.BOSS1);
  fill(10,42,14,46,TT.PATH);// path to boss

  // South from forest to ruins
  fill(10,46,14,52,TT.PATH);

  // ZONE 3: Cursed Swamp — top-right + center-right, rows 9-44, cols 32-58
  fill(32,9,58,44,TT.TALL);
  fill(32,9,58,9,TT.WATER);fill(32,9,32,44,TT.WATER);fill(58,9,58,44,TT.WATER);
  fill(36,15,41,20,TT.WATER);fill(50,12,56,17,TT.WATER);
  fill(44,25,49,30,TT.WATER);fill(34,34,38,38,TT.WATER);fill(52,32,57,37,TT.WATER);
  // Paths through swamp
  fill(32,9,58,11,TT.PATH);fill(41,11,44,44,TT.PATH);
  fill(32,22,40,24,TT.PATH);fill(45,22,58,24,TT.PATH);
  // Chests
  set(34,10,TT.CHEST);set(56,20,TT.CHEST);
  // Boss3 area
  fill(46,40,56,44,TT.TALL);set(51,42,TT.BOSS3);
  fill(41,40,51,44,TT.PATH);

  // South from swamp to ruins
  fill(41,44,44,52,TT.PATH);

  // ZONE 4: Forsaken Ruins — center, rows 52-59, cols 6-56
  fill(6,52,56,59,TT.RUINS);
  fill(6,52,56,52,TT.WALL);fill(6,59,56,59,TT.WALL);
  fill(6,52,6,59,TT.WALL);fill(56,52,56,59,TT.WALL);
  fill(10,54,15,57,TT.WALL);fill(22,54,26,57,TT.WALL);
  fill(36,54,40,57,TT.WALL);fill(48,54,52,57,TT.WALL);
  // Entry openings
  set(10,52,TT.RUINS);set(11,52,TT.RUINS);// north entry from forest path
  set(42,52,TT.RUINS);set(43,52,TT.RUINS);// north entry from swamp
  set(6,55,TT.RUINS);set(6,56,TT.RUINS);
  // Chests
  set(18,56,TT.CHEST);set(45,56,TT.CHEST);
  // Boss2 center
  set(31,56,TT.BOSS2);

  // Path south to castle (but map only goes to row 59 so castle is symbolic)
  // We'll loop back after beating boss2 — trigger victory

  return m;
}

// ===================== ZONE DETECTION =====================
function getZone(tx,ty){
  if(ty<20) return 'start';
  if(tx<28&&ty<44) return 'forest';
  if(tx>=32&&ty<46) return 'swamp';
  return 'ruins';
}

// ===================== TILE TEXTURES =====================
function th(x,y){return((x*73+y*137+x*y*17)&0xff)/255;}

function drawTile(ctx,t,px,py,tx,ty){
  const s=TILE,h2=th(tx,ty),h3=th(tx+31,ty+17);
  switch(t){
    case TT.GRASS:{
      const g=Math.floor(18+h2*8);
      ctx.fillStyle=`rgb(${10+Math.floor(h2*6)},${g+10},${8+Math.floor(h2*4)})`;
      ctx.fillRect(px,py,s,s);
      // grass tufts
      ctx.fillStyle=`rgba(20,${g+20},12,0.5)`;
      for(let i=0;i<4;i++){
        const bx=px+Math.floor(((h2*(i+1)*37)%1)*s);
        const by=py+Math.floor(((h3*(i+2)*41)%1)*s);
        ctx.fillRect(bx,by,2,5);ctx.fillRect(bx+1,by-2,1,3);
      }
      break;}
    case TT.PATH:{
      const base=55+Math.floor(h2*15);
      ctx.fillStyle=`rgb(${base-5},${base-8},${base-8})`;
      ctx.fillRect(px,py,s,s);
      // cracks
      ctx.strokeStyle=`rgba(30,25,25,0.4)`;ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(px+Math.floor(h2*s),py);
      ctx.lineTo(px+Math.floor(h3*s),py+s);
      ctx.stroke();
      break;}
    case TT.WALL:{
      const base=30+Math.floor(h2*10);
      ctx.fillStyle=`rgb(${base},${base-4},${base-4})`;
      ctx.fillRect(px,py,s,s);
      // stone blocks
      ctx.strokeStyle='rgba(15,12,12,0.6)';ctx.lineWidth=1;
      const bh=16;
      for(let row=0;row<s/bh;row++){
        const off=(row%2)*12;
        ctx.strokeRect(px,py+row*bh,s,bh);
        ctx.strokeRect(px+off,py+row*bh,24,bh);
      }
      break;}
    case TT.WATER:{
      ctx.fillStyle='#080814';ctx.fillRect(px,py,s,s);
      const t2=Date.now()/1200;
      ctx.fillStyle='rgba(20,20,60,0.5)';
      for(let i=0;i<3;i++){
        const wx=px+((h2*s+i*16+Math.sin(t2+i)*8)|0)%s;
        ctx.fillRect(wx,py+8+i*14,20,2);
      }
      break;}
    case TT.RUINS:{
      const base=45+Math.floor(h2*12);
      ctx.fillStyle=`rgb(${base},${base-8},${base-12})`;
      ctx.fillRect(px,py,s,s);
      ctx.strokeStyle='rgba(20,15,10,0.5)';ctx.lineWidth=1;
      ctx.strokeRect(px+4,py+4,s-8,s-8);
      ctx.strokeRect(px+10,py+10,s-20,s-20);
      break;}
    case TT.TALL:{
      const g=Math.floor(8+h2*5);
      ctx.fillStyle=`rgb(${g},${g+14},${g})`;
      ctx.fillRect(px,py,s,s);
      ctx.fillStyle='rgba(10,25,8,0.7)';
      for(let i=0;i<6;i++){
        const bx=px+Math.floor(((h2*(i+3)*19)%1)*s);
        const by=py+Math.floor(((h3*(i+1)*23)%1)*s);
        ctx.fillRect(bx,by,3,10);ctx.fillRect(bx-1,by+2,2,7);
      }
      break;}
    case TT.CHEST:{
      // chest base (gold box)
      ctx.fillStyle='#3d2a10';ctx.fillRect(px+8,py+14,s-16,s-20);
      ctx.fillStyle='#c9a227';ctx.fillRect(px+8,py+12,s-16,10);
      ctx.fillStyle='#8a6a10';ctx.fillRect(px+10,py+14,s-20,s-22);
      // latch
      ctx.fillStyle='#f5c842';ctx.fillRect(px+s/2-4,py+16,8,8);
      // glow
      ctx.fillStyle='rgba(245,200,66,0.15)';ctx.fillRect(px,py,s,s);
      break;}
    case TT.TREE:{
      // trunk
      ctx.fillStyle='#2a1a08';ctx.fillRect(px+18,py+28,12,s-28);
      // canopy
      ctx.fillStyle=`rgb(12,${28+Math.floor(h2*10)},10)`;
      ctx.beginPath();ctx.arc(px+s/2,py+20,20,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`rgb(8,${22+Math.floor(h3*8)},8)`;
      ctx.beginPath();ctx.arc(px+s/2-6,py+26,14,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(px+s/2+6,py+24,13,0,Math.PI*2);ctx.fill();
      break;}
    case TT.ASH:{
      const base=38+Math.floor(h2*8);
      ctx.fillStyle=`rgb(${base},${base-4},${base-6})`;
      ctx.fillRect(px,py,s,s);
      break;}
    case TT.SAGE:case TT.VENDOR:case TT.GUARD:{
      // draw floor under NPC
      ctx.fillStyle='#3a3535';ctx.fillRect(px,py,s,s);
      // NPC sprite
      const clr=t===TT.SAGE?'#6a4a8a':t===TT.VENDOR?'#4a6a4a':'#6a4a4a';
      drawNPC(ctx,px+s/2,py+s/2,clr);
      break;}
    case TT.BOSS1:case TT.BOSS2:case TT.BOSS3:case TT.BOSSF:{
      ctx.fillStyle='#1a0a0a';ctx.fillRect(px,py,s,s);
      const gt=Date.now()/500;
      const clr=t===TT.BOSSF?'rgba(201,162,39,0.3)':'rgba(180,20,20,0.3)';
      ctx.fillStyle=clr;
      ctx.beginPath();ctx.arc(px+s/2,py+s/2,(12+Math.sin(gt)*3),0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,80,80,0.6)';
      ctx.font='bold 10px serif';ctx.textAlign='center';
      ctx.fillText('⚠',px+s/2,py+s/2+4);
      break;}
    default:
      ctx.fillStyle='#111';ctx.fillRect(px,py,s,s);
  }
}

function drawNPC(ctx,cx,cy,clr){
  // body
  ctx.fillStyle=clr;ctx.fillRect(cx-6,cy-6,12,14);
  // head
  ctx.fillStyle='#d4a88a';ctx.beginPath();ctx.arc(cx,cy-10,8,0,Math.PI*2);ctx.fill();
  // eyes
  ctx.fillStyle='#222';ctx.fillRect(cx-3,cy-11,2,2);ctx.fillRect(cx+1,cy-11,2,2);
}

// ===================== PLAYER SPRITE (top-down) =====================
function drawPlayer(ctx,px,py,dir,animF){
  const cx=px,cy=py;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.ellipse(cx,cy+18,10,5,0,0,Math.PI*2);ctx.fill();
  // legs animation
  const legOff=animF%2===0?3:-3;
  ctx.fillStyle='#1a1a2a';
  if(dir===0||dir===2){// up/down: side legs
    ctx.fillRect(cx-7,cy+5,5,12);ctx.fillRect(cx+2,cy+5,5,12);
    if(G.player.moving){ctx.fillRect(cx-7,cy+5+legOff,5,12);ctx.fillRect(cx+2,cy+5-legOff,5,12);}
  } else {// left/right: stagger legs
    ctx.fillRect(cx-6,cy+5,5,12);ctx.fillRect(cx+1,cy+5,5,12);
    if(G.player.moving){ctx.fillRect(cx-6,cy+5+legOff,5,12);ctx.fillRect(cx+1,cy+5-legOff,5,12);}
  }
  // cloak / body
  ctx.fillStyle='#2a2040';ctx.fillRect(cx-9,cy-6,18,18);
  // golden trim
  ctx.fillStyle='#c9a227';ctx.fillRect(cx-9,cy-6,18,2);ctx.fillRect(cx-9,cy-6,2,18);ctx.fillRect(cx+7,cy-6,2,18);
  // head
  ctx.fillStyle='#d4a88a';ctx.beginPath();ctx.arc(cx,cy-12,9,0,Math.PI*2);ctx.fill();
  // helmet
  ctx.fillStyle='#3a3040';ctx.fillRect(cx-9,cy-20,18,12);
  ctx.fillStyle='#c9a227';ctx.fillRect(cx-9,cy-20,18,2);
  // face direction indicator
  if(dir===2){ctx.fillStyle='#d4a88a';ctx.fillRect(cx-3,cy-14,6,5);}// face down
  else if(dir===0){ctx.fillStyle='#2a2040';ctx.fillRect(cx-3,cy-14,6,5);}// back
  // weapon
  ctx.fillStyle='#8a8888';
  if(dir===1){ctx.fillRect(cx+9,cy-8,3,18);}
  else if(dir===3){ctx.fillRect(cx-12,cy-8,3,18);}
  else{ctx.fillRect(cx+10,cy-10,3,18);}
}

function drawMonsterBattle(ctx,key,x,y,w,h,hitFlash){
  const def=MONS[key];
  const cx=x+w/2,cy=y+h/2;
  if(hitFlash){ctx.globalAlpha=0.7;ctx.fillStyle='#fff';ctx.fillRect(x,y,w,h);ctx.globalAlpha=1;return;}
  const glw=def.glow,clr=def.color;
  // glow aura
  const grad=ctx.createRadialGradient(cx,cy,10,cx,cy,w/2);
  grad.addColorStop(0,glw+'44');grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad;ctx.fillRect(x,y,w,h);

  switch(key){
    case 'shadow_sprite':{
      ctx.fillStyle=clr;ctx.beginPath();ctx.ellipse(cx,cy+10,30,20,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=clr;ctx.beginPath();ctx.ellipse(cx,cy-10,20,30,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=glw;ctx.beginPath();ctx.arc(cx-8,cy-15,5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx+8,cy-15,5,0,Math.PI*2);ctx.fill();
      // tentacles
      for(let i=0;i<4;i++){
        const ang=-Math.PI/2+Math.PI/3*(i-1.5);
        ctx.strokeStyle=clr;ctx.lineWidth=4;
        ctx.beginPath();ctx.moveTo(cx,cy+10);
        ctx.quadraticCurveTo(cx+Math.cos(ang)*40,cy+Math.sin(ang)*30+20,cx+Math.cos(ang)*60,cy+40);
        ctx.stroke();
      }
      break;}
    case 'cursed_wolf':{
      ctx.fillStyle=clr;
      // body
      ctx.fillRect(cx-35,cy-10,70,30);ctx.fillRect(cx-15,cy-30,30,25);
      // head
      ctx.fillRect(cx+20,cy-40,40,35);
      // snout
      ctx.fillRect(cx+50,cy-30,20,15);
      // ears
      ctx.fillRect(cx+25,cy-55,10,20);ctx.fillRect(cx+45,cy-55,10,20);
      // eyes
      ctx.fillStyle=glw;ctx.fillRect(cx+28,cy-38,8,6);ctx.fillRect(cx+46,cy-38,8,6);
      // legs
      ctx.fillStyle=clr;
      ctx.fillRect(cx-30,cy+18,12,25);ctx.fillRect(cx-12,cy+18,12,25);
      ctx.fillRect(cx+10,cy+18,12,25);ctx.fillRect(cx+28,cy+18,12,25);
      break;}
    case 'dark_wraith':{

      ctx.fillStyle=clr;ctx.beginPath();
      ctx.moveTo(cx-20,cy-50);ctx.lineTo(cx+20,cy-50);
      ctx.lineTo(cx+35,cy+40);ctx.lineTo(cx-35,cy+40);ctx.closePath();ctx.fill();
      // hood
      ctx.beginPath();ctx.arc(cx,cy-50,22,Math.PI,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.moveTo(cx-22,cy-50);ctx.lineTo(cx-30,cy-30);ctx.lineTo(cx+30,cy-30);ctx.lineTo(cx+22,cy-50);ctx.fill();
      // eyes
      ctx.fillStyle=glw;ctx.fillRect(cx-10,cy-52,8,6);ctx.fillRect(cx+2,cy-52,8,6);
      // hands/scythe
      ctx.strokeStyle='#555';ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(cx+20,cy-20);ctx.lineTo(cx+50,cy+30);ctx.stroke();
      ctx.strokeStyle=glw;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(cx+55,cy+20,15,0,Math.PI);ctx.stroke();
      break;}
    case 'plague_rat':{
      ctx.fillStyle=clr;
      ctx.ellipse&&(ctx.beginPath(),ctx.ellipse(cx,cy+5,35,20,0,0,Math.PI*2),ctx.fill());
      ctx.beginPath();ctx.arc(cx+30,cy-5,18,0,Math.PI*2);ctx.fill();

      ctx.fillStyle='#2a1a0a';ctx.beginPath();ctx.ellipse(cx+25,cy-20,6,10,-.3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(cx+40,cy-18,6,10,.3,0,Math.PI*2);ctx.fill();

      ctx.strokeStyle=clr;ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(cx-35,cy+10);ctx.quadraticCurveTo(cx-50,cy+30,cx-45,cy+50);ctx.stroke();

    case 'swamp_serpent':{
      ctx.strokeStyle=clr;ctx.lineWidth=28;
      ctx.beginPath();ctx.moveTo(cx-40,cy+40);
      ctx.bezierCurveTo(cx-20,cy-20,cx+20,cy-20,cx+40,cy+40);ctx.stroke();

      ctx.globalAlpha=1;
      // body

      ctx.beginPath();ctx.arc(cx,cy-35,12,0,Math.PI*2);ctx.fill();

    case 'stone_golem':{
      ctx.fillStyle=clr;
      // legs
      ctx.fillRect(cx-25,cy+20,20,40);ctx.fillRect(cx+5,cy+20,20,40);
      // body
      ctx.fillRect(cx-30,cy-30,60,55);
      // arms
      ctx.fillRect(cx-50,cy-20,25,50);ctx.fillRect(cx+25,cy-20,25,50);
      // head
      ctx.fillRect(cx-20,cy-55,40,30);
      // cracks
      ctx.strokeStyle='#8a7a6a';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cx-10,cy-40);ctx.lineTo(cx+5,cy-10);ctx.stroke();

      ctx.fillRect(cx-30,cy-10,15,40);ctx.fillRect(cx+15,cy-10,15,40);
      ctx.fillRect(cx-16,cy-50,32,35);
      ctx.fillStyle='#4a4a5a';ctx.fillRect(cx-16,cy-50,32,10);
      ctx.fillStyle=glw;ctx.fillRect(cx-6,cy-38,5,5);ctx.fillRect(cx+1,cy-38,5,5);
      // sword
      ctx.fillStyle='#aaaaaa';ctx.fillRect(cx+28,cy-40,6,80);
      ctx.fillStyle='#c9a227';ctx.fillRect(cx+20,cy-10,22,6);
      break;}
    case 'bone_archer':{
      ctx.fillStyle='#d4c8a8';
      ctx.fillRect(cx-8,cy+20,8,30);ctx.fillRect(cx+0,cy+20,8,30);
      ctx.fillRect(cx-12,cy-10,24,35);
      ctx.fillRect(cx-25,cy-5,16,30);ctx.fillRect(cx+9,cy-5,16,30);
      ctx.beginPath();ctx.arc(cx,cy-22,14,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2a2010';ctx.fillRect(cx-4,cy-27,3,3);ctx.fillRect(cx+1,cy-27,3,3);
      ctx.strokeStyle='#8a7a5a';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(cx+35,cy,25,-.8,.8);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+58,cy-20);ctx.lineTo(cx+58,cy+20);ctx.stroke();
      break;}
    case 'thornlord':{
      // massive tree demon
      ctx.fillStyle=clr;
      ctx.fillRect(cx-35,cy+10,25,60);ctx.fillRect(cx+10,cy+10,25,60);
      ctx.fillRect(cx-40,cy-50,80,65);
      ctx.fillRect(cx-55,cy-30,20,50);ctx.fillRect(cx+35,cy-30,20,50);
      ctx.beginPath();ctx.arc(cx,cy-65,35,0,Math.PI*2);ctx.fill();
      // thorns
      ctx.fillStyle='#0a2a00';
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4;
        ctx.fillRect(cx+Math.cos(a)*38-2,cy-65+Math.sin(a)*38-2,4,12);
      }
      ctx.fillStyle=glw;ctx.fillRect(cx-12,cy-72,10,10);ctx.fillRect(cx+2,cy-72,10,10);
      ctx.beginPath();ctx.arc(cx,cy-55,8,0,Math.PI*2);ctx.fill();

    case 'plague_sov':{

      ctx.fillRect(cx-30,cy+20,25,50);ctx.fillRect(cx+5,cy+20,25,50);
      ctx.fillRect(cx-35,cy-40,70,65);
      ctx.fillRect(cx-55,cy-20,25,55);ctx.fillRect(cx+30,cy-20,25,55);
      ctx.beginPath();ctx.arc(cx,cy-55,30,0,Math.PI*2);ctx.fill();
      // plague pustules
      ctx.fillStyle=glw;
      for(let i=0;i<6;i++){

        ctx.beginPath();ctx.arc(cx-20+i*8,cy-10+Math.sin(t2)*5,5+Math.sin(t2)*2,0,Math.PI*2);ctx.fill();

      ctx.fillStyle='#0a0a2a';ctx.fillRect(cx-8,cy-48,16,8);// visor

      ctx.fillStyle=glw;ctx.fillRect(cx+14,cy-18,24,6);
      ctx.fillStyle='#4a4a6a';ctx.fillRect(cx+24,cy-58,4,6);

    case 'elden_shade':{
      // massive shadowy god
      const t3=Date.now()/400;
      ctx.fillStyle='rgba(6,4,15,0.95)';
      ctx.fillRect(cx-45,cy+10,35,80);ctx.fillRect(cx+10,cy+10,35,80);
      ctx.fillRect(cx-50,cy-60,100,75);

      ctx.beginPath();ctx.arc(cx,cy-80,40,0,Math.PI*2);ctx.fill();
      // golden crown fragments
      ctx.fillStyle=glw;
      for(let i=0;i<5;i++){
        const a=i*Math.PI/2.5-Math.PI/2;
        const rx=cx+Math.cos(a)*35,ry=cy-80+Math.sin(a)*20;
        ctx.beginPath();ctx.arc(rx,ry,5+Math.sin(t3+i)*2,0,Math.PI*2);ctx.fill();
      }
      ctx.fillStyle=glw;ctx.fillRect(cx-14,cy-88,10,12);ctx.fillRect(cx+4,cy-88,10,12);

      ctx.strokeStyle=glw;ctx.lineWidth=2;ctx.globalAlpha=0.4+Math.sin(t3)*0.2;
      for(let i=0;i<3;i++){
        ctx.beginPath();ctx.arc(cx,cy-20,30+i*20+Math.sin(t3+i)*5,0,Math.PI*2);ctx.stroke();
      }
      ctx.globalAlpha=1;
      break;}
  }
}

// ===================== CAMERA =====================
function updateCamera(){
  const p=G.player;
  G.camX=p.px-W/2;G.camY=p.py-H/2;
}

// ===================== RENDERING: EXPLORE =====================
function renderExplore(){
  ctx.fillStyle='#060409';ctx.fillRect(0,0,W,H);

  // background fog
  const fog=ctx.createRadialGradient(W/2,H/2,80,W/2,H/2,Math.max(W,H));
  fog.addColorStop(0,'rgba(0,0,0,0)');fog.addColorStop(1,'rgba(4,2,8,0.6)');

  const startX=Math.floor(G.camX/TILE)-1;
  const startY=Math.floor(G.camY/TILE)-1;
  const endX=startX+Math.ceil(W/TILE)+2;
  const endY=startY+Math.ceil(H/TILE)+2;

  for(let ty=startY;ty<=endY;ty++){
    for(let tx=startX;tx<=endX;tx++){
      if(tx<0||ty<0||tx>=MW||ty>=MH) continue;
      const tile=G.map[ty][tx];
      const px=tx*TILE-G.camX;
      const py=ty*TILE-G.camY;
      // If chest is looted, draw path
      const t=(tile===TT.CHEST&&G.lootedChests.has(ty*MW+tx))?TT.PATH:tile;
      drawTile(ctx,t,px,py,tx,ty);
    }
  }

  // Fog overlay
  ctx.fillStyle=fog;ctx.fillRect(0,0,W,H);

  // Player
  const pp=G.player;
  const pdx=Math.round(pp.px-G.camX);
  const pdy=Math.round(pp.py-G.camY);
  drawPlayer(ctx,pdx,pdy,pp.dir,pp.animF);

  renderHUD();
  renderMinimap();

  // Flash message
  if(G.flash.timer>0){
    ctx.globalAlpha=Math.min(1,G.flash.timer/20);
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(W/2-200,H/2-30,400,60);
    ctx.fillStyle='#f5c842';ctx.font='bold 22px Georgia';ctx.textAlign='center';
    ctx.fillText(G.flash.msg,W/2,H/2+8);
    ctx.globalAlpha=1;
    G.flash.timer--;
  }

  // Notification (item found etc)
  if(G.notification.timer>0){
    const alpha=Math.min(1,G.notification.timer/15);
    ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(W/2-180,80,360,50);
    ctx.strokeStyle='#c9a227';ctx.lineWidth=1;ctx.strokeRect(W/2-180,80,360,50);
    ctx.fillStyle='#f5c842';ctx.font='16px Georgia';ctx.textAlign='center';
    ctx.fillText(G.notification.msg,W/2,110);
    ctx.globalAlpha=1;
    G.notification.timer--;
  }
}

// ===================== HUD =====================
function renderHUD(){
  const p=G.player;
  // Top-left panel
  ctx.fillStyle='rgba(6,4,15,0.85)';ctx.fillRect(10,10,230,80);
  ctx.strokeStyle='#2a2040';ctx.lineWidth=1;ctx.strokeRect(10,10,230,80);

  // Name + level
  ctx.fillStyle='#f5c842';ctx.font='bold 14px Georgia';ctx.textAlign='left';
  ctx.fillText(`${p.name}  Lv.${p.level}`,18,30);

  // HP bar
  const hpPct=p.hp/p.maxHp;
  ctx.fillStyle='#1a0a0a';ctx.fillRect(18,38,190,12);
  ctx.fillStyle=hpPct>0.5?'#22c55e':hpPct>0.25?'#f59e0b':'#ef4444';
  ctx.fillRect(18,38,190*hpPct,12);
  ctx.fillStyle='#aaa';ctx.font='10px Georgia';
  ctx.fillText(`HP ${p.hp}/${p.maxHp}`,18,50);

  // MP bar
  ctx.fillStyle='#0a0a2a';ctx.fillRect(18,56,190,12);
  ctx.fillStyle='#3b82f6';ctx.fillRect(18,56,190*(p.mp/p.maxMp),12);
  ctx.fillStyle='#aaa';ctx.fillText(`MP ${p.mp}/${p.maxMp}`,18,68);

  // XP bar
  ctx.fillStyle='#1a0a2a';ctx.fillRect(18,74,190,8);
  ctx.fillStyle='#a855f7';ctx.fillRect(18,74,190*(p.xp/p.xpNext),8);

  // Gold + zone
  ctx.fillStyle='rgba(6,4,15,0.85)';ctx.fillRect(W-160,10,150,40);
  ctx.strokeStyle='#2a2040';ctx.strokeRect(W-160,10,150,40);
  ctx.fillStyle='#f5c842';ctx.font='14px Georgia';ctx.textAlign='right';
  ctx.fillText(`💰 ${p.gold}`,W-18,32);
  const zone=getZone(p.tx,p.ty);
  const znames={start:'Ruines de Départ',forest:'Forêt Ancestrale',swamp:'Marais Maudit',ruins:'Ruines Oubliées'};
  ctx.fillStyle='#9977cc';ctx.font='11px Georgia';
  ctx.fillText(znames[zone]||zone,W-18,48);

  // Weapon display
  ctx.fillStyle='rgba(6,4,15,0.75)';ctx.fillRect(10,H-50,200,40);
  ctx.strokeStyle='#2a2040';ctx.strokeRect(10,H-50,200,40);
  ctx.fillStyle='#c9a227';ctx.font='11px Georgia';ctx.textAlign='left';
  ctx.fillText(`⚔ ${p.weapon.name}`,18,H-33);
  ctx.fillStyle='#7a6a9a';ctx.font='10px Georgia';
  ctx.fillText(`ATK×${p.weapon.atkM.toFixed(1)}  MATK×${p.weapon.matkM.toFixed(1)}`,18,H-18);

  // Controls hint
  ctx.fillStyle='rgba(120,100,180,0.6)';ctx.font='10px Georgia';ctx.textAlign='right';
  ctx.fillText('ZQSD/Flèches: Déplacer  ESPACE: Interagir  I: Inventaire',W-14,H-10);
}

// ===================== MINIMAP =====================
function renderMinimap(){
  const sz=70,ts=sz/MW;
  const mx=W-sz-10,my=H-sz-60;
  ctx.fillStyle='rgba(4,2,10,0.9)';ctx.fillRect(mx,my,sz,sz);
  ctx.strokeStyle='#2a2040';ctx.strokeRect(mx,my,sz,sz);
  const MCOLORS={[TT.GRASS]:'#1a3a0a',[TT.PATH]:'#3a3535',[TT.WALL]:'#1a1010',
    [TT.WATER]:'#080820',[TT.RUINS]:'#3d3020',[TT.TALL]:'#0a2005',
    [TT.TREE]:'#0a1a05',[TT.ASH]:'#2a2218',[TT.CHEST]:'#c9a227',
    [TT.SAGE]:'#8844cc',[TT.VENDOR]:'#44aa44',
    [TT.BOSS1]:'#cc3300',[TT.BOSS2]:'#cc3300',[TT.BOSS3]:'#cc3300',[TT.BOSSF]:'#ffaa00',
  };
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){
    const t=G.map[ty][tx];
    const c=MCOLORS[t]||'#111';
    ctx.fillStyle=c;ctx.fillRect(mx+tx*ts,my+ty*ts,Math.ceil(ts),Math.ceil(ts));
  }
  // player dot
  ctx.fillStyle='#fff';
  ctx.fillRect(mx+G.player.tx*ts-1,my+G.player.ty*ts-1,3,3);
}

// ===================== RENDERING: COMBAT =====================
function renderCombat(){
  const cb=G.combat;
  const t=Date.now()/1000;

  // Background (zone-tinted)
  ctx.fillStyle='#06040f';ctx.fillRect(0,0,W,H);
  // Arena ground
  const arenaGrad=ctx.createLinearGradient(0,H*0.55,0,H);
  arenaGrad.addColorStop(0,'#1a1030');arenaGrad.addColorStop(1,'#060410');
  ctx.fillStyle=arenaGrad;ctx.fillRect(0,H*0.55,W,H*0.45);
  // Ground line
  ctx.strokeStyle='#2a2050';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,H*0.57);ctx.lineTo(W,H*0.57);ctx.stroke();

  // Atmospheric particles
  ctx.fillStyle='rgba(100,70,180,0.3)';
  for(let i=0;i<5;i++){
    const bx=(t*30+i*120)%W;
    const by=H*0.3+Math.sin(t+i*1.5)*60;
    ctx.beginPath();ctx.arc(bx,by,1.5,0,Math.PI*2);ctx.fill();
  }

  // Enemy sprite area
  const eW=Math.min(180,W*0.25),eH=Math.min(220,H*0.4);
  const eX=W*0.6,eY=H*0.15;
  const eLunge=cb.enemyAnim==='lunge'?-20:0;
  const eHit=cb.playerAnim==='hit_e';
  ctx.save();ctx.translate(eLunge,0);
  drawMonsterBattle(ctx,cb.enemyKey,eX,eY,eW,eH,eHit);
  ctx.restore();

  // Enemy HP bar
  renderCombatBar(ctx,eX,eY-30,eW,cb.enemy.name,cb.enemy.hp,cb.enemy.maxHp,'#ef4444',cb.enemy.boss);

  // Player sprite area
  const pW=Math.min(130,W*0.18),pH=Math.min(180,H*0.35);
  const pX=W*0.12,pY=H*0.22;
  const pLunge=cb.playerAnim==='lunge'?30:0;
  const pHit=cb.enemyAnim==='hit_p';
  ctx.save();ctx.translate(pLunge,0);
  drawPlayerBattle(ctx,pX,pY,pW,pH,pHit);
  ctx.restore();

  // Player HP/MP bars
  renderCombatBar(ctx,pX,pY-30,pW,G.player.name,G.player.hp,G.player.maxHp,'#22c55e',false);
  ctx.fillStyle='#0a0a2a';ctx.fillRect(pX,pY-14,pW,8);
  ctx.fillStyle='#3b82f6';ctx.fillRect(pX,pY-14,pW*(G.player.mp/G.player.maxMp),8);
  ctx.fillStyle='#7aa8ff';ctx.font='9px Georgia';ctx.textAlign='left';
  ctx.fillText(`MP ${G.player.mp}/${G.player.maxMp}`,pX,pY-6);

  // Battle log
  ctx.fillStyle='rgba(6,4,15,0.9)';ctx.fillRect(W*0.05,H*0.6,W*0.9,H*0.1);
  ctx.strokeStyle='#2a2050';ctx.lineWidth=1;ctx.strokeRect(W*0.05,H*0.6,W*0.9,H*0.1);
  ctx.fillStyle='#e8d8ff';ctx.font='15px Georgia';ctx.textAlign='center';
  if(cb.log.length>0) ctx.fillText(cb.log[cb.log.length-1],W/2,H*0.67);
  if(cb.log.length>1){ctx.globalAlpha=0.5;ctx.font='13px Georgia';ctx.fillText(cb.log[cb.log.length-2],W/2,H*0.63);ctx.globalAlpha=1;}

  // Action menu (if waiting for player input)
  if(cb.phase==='player'){
    renderActionMenu();
  } else if(cb.phase==='skill_menu'){
    renderSkillMenu();
  } else if(cb.phase==='item_menu'){
    renderItemMenu();
  }

  // Buffs display
  if(G.player.buffs.length>0){
    ctx.fillStyle='rgba(6,4,15,0.7)';ctx.fillRect(10,H*0.6,120,20*G.player.buffs.length+10);
    G.player.buffs.forEach((b,i)=>{
      ctx.fillStyle='#a855f7';ctx.font='10px Georgia';ctx.textAlign='left';
      ctx.fillText(`${b.stat}+${b.amount} (${b.turns}t)`,14,H*0.6+16+i*18);
    });
  }
}

function renderCombatBar(ctx,x,y,w,name,hp,maxHp,clr,boss){
  ctx.fillStyle='rgba(6,4,15,0.85)';ctx.fillRect(x,y,w,22);
  ctx.strokeStyle=boss?'#c9a227':'#2a2050';ctx.lineWidth=boss?2:1;ctx.strokeRect(x,y,w,22);
  ctx.fillStyle='#1a0a0a';ctx.fillRect(x+2,y+12,w-4,8);
  ctx.fillStyle=clr;ctx.fillRect(x+2,y+12,(w-4)*Math.max(0,hp/maxHp),8);
  ctx.fillStyle=boss?'#f5c842':'#e8d8ff';ctx.font=(boss?'bold ':' ')+'11px Georgia';ctx.textAlign='left';
  ctx.fillText(`${name} ${hp}/${maxHp}`,x+2,y+10);
}

function renderDialogue(){
  const dl=G.dlg;
  const bh=130,bw=Math.min(700,W-40),bx=(W-bw)/2,by=H-bh-20;
  // dark box
  ctx.fillStyle='rgba(6,4,15,0.97)';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#c9a227';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
  ctx.strokeStyle='#2a2050';ctx.lineWidth=1;ctx.strokeRect(bx+4,by+4,bw-8,bh-8);
  // Speaker
  ctx.fillStyle='#f5c842';ctx.font='bold 14px Georgia';ctx.textAlign='left';
  ctx.fillText(dl.lines[dl.idx].spk,bx+16,by+24);
  // Text
  ctx.fillStyle='#e8d8ff';ctx.font='14px Georgia';
  const text=dl.lines[dl.idx].txt;
  // Word wrap
  const words=text.split(' ');let line='';let lineY=by+48;
  words.forEach(word=>{
    const test=line+word+' ';
    if(ctx.measureText(test).width>bw-32&&line!==''){
      ctx.fillText(line,bx+16,lineY);line=word+' ';lineY+=20;
    } else line=test;
  });
  ctx.fillText(line,bx+16,lineY);
  // Prompt
  const blink=Math.floor(Date.now()/500)%2===0;
  if(blink){
    ctx.fillStyle='#c9a227';ctx.font='12px Georgia';ctx.textAlign='right';
    ctx.fillText('▼ ESPACE pour continuer',bx+bw-16,by+bh-12);
  }
}

// ===================== SKILLS =====================
function getPlayerSkills(){
  const p=G.player;
  const skills=[
    {name:'Frappe Lourde',mp:10,desc:'150% dégâts physiques',
     use(atk){return Math.floor(calcDmg(atk*1.5,G.combat.enemy.def,'phys'));}},
    {name:'Brasier',mp:15,desc:'Dégâts magiques',
     use(atk){return Math.floor(calcDmg(p.matk*p.weapon.matkM,G.combat.enemy.mdef,'mag'));}},
    {name:'Soin',mp:20,desc:'Restore 30% HP',
     use(){const amt=Math.floor(p.maxHp*0.3);p.hp=Math.min(p.maxHp,p.hp+amt);return 0;}},
    {name:'Bouclier',mp:10,desc:'+50% DEF (3 tours)',
     use(){p.buffs.push({stat:'def',amount:Math.floor(p.def*0.5),turns:3});return 0;}},
  ];
  if(p.level>=5) skills.push({name:'Nova du Vide',mp:25,desc:'Dégâts magiques massifs',
     use(){return Math.floor(calcDmg(p.matk*p.weapon.matkM*1.8,G.combat.enemy.mdef,'mag'));}});
  return skills;
}

function calcDmg(atk,def,type){
  const base=Math.max(1,atk-def*0.7);
  const variance=0.85+Math.random()*0.3;
  return Math.floor(base*variance);
}

// ===================== COMBAT SYSTEM =====================
function startCombat(monsterKey,isBoss){
  const def=JSON.parse(JSON.stringify(MONS[monsterKey]));
  // Scale monster to player level
  const scale=1+G.player.level*0.1;
  def.hp=Math.floor(def.hp*scale);def.maxHp=def.hp;
  def.atk=Math.floor(def.atk*scale);def.def=Math.floor(def.def*scale);
  def.matk=Math.floor(def.matk*scale);def.mdef=Math.floor(def.mdef*scale);

  G.state='combat';
  G.combat={
    enemyKey:monsterKey,
    enemy:def,
    phase:'player',// player|enemy|anim|skill_menu|item_menu
    menuSel:0,skillSel:0,itemSel:0,
    log:['Un combat commence !'],
    playerAnim:'',enemyAnim:'',animTimer:0,
    isBoss:!!isBoss,
    pendingAction:null,
  };
  SFX.encounter();
}

function combatPlayerAction(action){
  const cb=G.combat,p=G.player;
  if(cb.phase!=='player'&&cb.phase!=='skill_menu'&&cb.phase!=='item_menu') return;

  let dmg=0,msg='';

  if(action==='attack'){
    const eff_atk=p.atk*p.weapon.atkM+p.buffs.filter(b=>b.stat==='atk').reduce((s,b)=>s+b.amount,0);
    dmg=calcDmg(eff_atk,cb.enemy.def,'phys');
    const crit=Math.random()<0.1;
    if(crit){dmg=Math.floor(dmg*1.8);msg=`CRITIQUE ! Vous infligez ${dmg} dégâts !`;}
    else msg=`Vous attaquez ! ${dmg} dégâts.`;
    cb.playerAnim='lunge';
    SFX.attack();
  } else if(action==='run'){
    if(cb.isBoss){cb.log.push('Impossible de fuir un boss !');return;}
    if(Math.random()<0.7){
      G.state='explore';G.combat=null;
      G.flash={msg:'Vous fuyez le combat !',timer:60};
      return;
    }
    msg='La fuite échoue !';
  } else if(action==='skill'){
    const skill=getPlayerSkills()[cb.skillSel];
    if(p.mp<skill.mp){cb.log.push('Pas assez de MP !');cb.phase='skill_menu';return;}
    p.mp-=skill.mp;
    const eff_atk=p.atk*p.weapon.atkM;
    dmg=skill.use(eff_atk);
    if(skill.name==='Soin'){msg=`Soin ! +${Math.floor(p.maxHp*0.3)} HP.`;}
    else if(skill.name==='Bouclier'){msg='Bouclier activé ! DEF +50% pendant 3 tours.';}
    else msg=`${skill.name} ! ${dmg} dégâts.`;
    cb.playerAnim='lunge';
    SFX.attack();
  } else if(action==='item'){
    const itms=p.items.filter(i=>i.qty>0);
    if(itms.length===0){cb.log.push('Aucun objet disponible !');cb.phase='player';return;}
    const itm=itms[cb.itemSel];
    const def=ITEM_DEF[itm.id];
    msg=def.use(p);
    itm.qty--;
    SFX.heal&&SFX.heal();
    cb.phase='enemy';
    cb.log.push(msg);
    setTimeout(()=>enemyTurn(),700);
    return;
  }

  if(dmg>0){
    cb.enemy.hp=Math.max(0,cb.enemy.hp-dmg);
    cb.enemyAnim='hit_e';
    setTimeout(()=>{cb.enemyAnim='';},200);
  }
  cb.log.push(msg);
  cb.phase='anim';
  cb.playerAnim='lunge';
  setTimeout(()=>{
    cb.playerAnim='';
    if(cb.enemy.hp<=0){combatVictory();return;}
    cb.phase='enemy';
    setTimeout(()=>enemyTurn(),400);
  },400);
}

function enemyTurn(){
  const cb=G.combat,p=G.player,e=cb.enemy;
  const useMagic=e.matk>e.atk&&Math.random()<0.4;
  let dmg=0,msg='';
  if(useMagic){
    dmg=calcDmg(e.matk,p.mdef,'mag');
    msg=`${e.name} lance un sort ! ${dmg} dégâts magiques.`;
  } else {
    const eff_def=p.def+p.buffs.filter(b=>b.stat==='def').reduce((s,b)=>s+b.amount,0);
    dmg=calcDmg(e.atk,eff_def,'phys');
    msg=`${e.name} attaque ! ${dmg} dégâts.`;
  }
  p.hp=Math.max(0,p.hp-dmg);
  cb.enemyAnim='lunge';
  cb.playerAnim='hit_p';
  SFX.hit();
  cb.log.push(msg);
  // Decrement buffs
  p.buffs=p.buffs.map(b=>({...b,turns:b.turns-1})).filter(b=>b.turns>0);
  setTimeout(()=>{
    cb.enemyAnim='';cb.playerAnim='';
    if(p.hp<=0){combatDefeat();return;}
    cb.phase='player';
  },500);
}

function combatVictory(){
  const cb=G.combat,p=G.player;
  const e=cb.enemy;
  p.xp+=e.xp;p.gold+=e.gold;
  let msg=`Victoire ! +${e.xp} XP, +${e.gold} or.`;
  SFX.victory&&SFX.victory();
  // Check level up
  let leveled=false;
  while(p.xp>=p.xpNext){
    p.xp-=p.xpNext;p.level++;
    p.xpNext=Math.floor(150*Math.pow(p.level,1.5));
    leveled=true;
  }
  cb.log.push(msg);
  cb.phase='done';

  if(cb.isBoss) G.defeatedBosses.add(cb.enemyKey);

  // Drop item?
  if(Math.random()<0.25){
    const itm=Math.random()<0.6?'p_sm':Math.random()<0.5?'p_lg':'elixir';
    const existing=p.items.find(i=>i.id===itm);
    if(existing) existing.qty++;
    else p.items.push({id:itm,qty:1});
    msg+=` Vous trouvez: ${ITEM_DEF[itm].name} !`;
    cb.log.push(`Vous trouvez: ${ITEM_DEF[itm].name} !`);
  }

  setTimeout(()=>{
    if(cb.enemyKey==='elden_shade'){
      G.state='victory';saveGame();return;
    }
    G.state='explore';G.combat=null;
    if(leveled){G.lvlup={sel:0};G.state='levelup';}
    saveGame();
  },1200);
}

function combatDefeat(){
  G.state='gameover';
  SFX.die&&SFX.die();
}

// ===================== LEVELUP =====================
function applyLevelUp(choice){
  const p=G.player;
  p.level++;
  p.xpNext=Math.floor(150*Math.pow(p.level,1.5));
  const choices=['maxHp','atk','def','matk','mdef','spd'];
  const amounts=[25,8,8,8,8,5];
  const id=choices[choice];
  p[id]+=amounts[choice];
  if(id==='maxHp') p.hp=Math.min(p.maxHp,p.hp+25);
  G.flash={msg:`+${amounts[choice]} ${['HP Max','ATK','DEF','MATK','MDEF','SPD'][choice]} !`,timer:80};
  G.lvlup=null;G.state='explore';
  SFX.levelUp&&SFX.levelUp();
  saveGame();
}

// ===================== INTERACTIONS =====================
function interact(){
  const p=G.player;
  // Check adjacent tiles (and current tile)
  const dirs=[{dx:0,dy:0},{dx:0,dy:-1},{dx:1,dy:0},{dx:0,dy:1},{dx:-1,dy:0}];
  for(const d of dirs){
    const tx=p.tx+d.dx,ty=p.ty+d.dy;
    if(tx<0||ty<0||tx>=MW||ty>=MH) continue;
    const tile=G.map[ty][tx];
    const key=ty*MW+tx;
    if(tile===TT.CHEST&&!G.lootedChests.has(key)){
      lootChest(tx,ty);return;
    }
    if(tile===TT.SAGE){
      openDialogue(DIALOGUES.sage);return;
    }
    if(tile===TT.VENDOR){
      openDialogue(DIALOGUES.vendor,()=>handleVendorBuy());return;
    }
  }
}

function handleVendorBuy(){
  const p=G.player;
  if(p.gold>=30){p.gold-=30;
    const ex=p.items.find(i=>i.id==='p_sm');
    if(ex)ex.qty++;else p.items.push({id:'p_sm',qty:1});
    G.notification={msg:'Vous achetez une Petite Potion ! (-30 or)',timer:120};
  } else {
    G.notification={msg:'Pas assez d\'or !',timer:80};
  }
}

function lootChest(tx,ty){
  G.lootedChests.add(ty*MW+tx);
  const wIdx=CHEST_POOL[Math.floor(Math.random()*CHEST_POOL.length)];
  const weapon=WEAPONS[wIdx];
  const p=G.player;
  const better=weapon.atkM+weapon.matkM>p.weapon.atkM+p.weapon.matkM;
  const msg=`Coffre ! Vous trouvez: ${weapon.name}.${better?' (Équipée !)':" (Moins bonne)"}`;
  if(better) p.weapon=weapon;
  G.notification={msg,timer:180};
  SFX.chest&&SFX.chest();
  saveGame();
}

function openDialogue(lines,cb){
  G.state='dialogue';
  G.dlg={lines,idx:0};
  G.dlgCB=cb||null;
}

function advanceDialogue(){
  if(!G.dlg) return;
  G.dlg.idx++;
  if(G.dlg.idx>=G.dlg.lines.length){
    const cb=G.dlgCB;
    G.dlg=null;G.dlgCB=null;
    G.state='explore';
    if(cb) cb();
  }
}

// ===================== BOSS TRIGGERS =====================
function checkBossTrigger(){
  const p=G.player;
  const tile=G.map[p.ty][p.tx];
  const bossMap={
    [TT.BOSS1]:{key:'thornlord',dlg:'boss1_pre'},
    [TT.BOSS2]:{key:'forsaken_knight',dlg:'boss2_pre'},
    [TT.BOSS3]:{key:'plague_sov',dlg:'boss3_pre'},
    [TT.BOSSF]:{key:'elden_shade',dlg:'bossf_pre'},
  };
  const boss=bossMap[tile];
  if(boss&&!G.defeatedBosses.has(boss.key)){
    G.pendingBoss=boss.key;
    openDialogue(DIALOGUES[boss.dlg],()=>{
      startCombat(G.pendingBoss,true);G.pendingBoss=null;
    });
  }
}

// ===================== RANDOM ENCOUNTER =====================
function tryEncounter(){
  const p=G.player;
  const tile=G.map[p.ty][p.tx];
  const rate=ENC_RATE[tile]||0;
  if(Math.random()>rate) return;
  const zone=getZone(p.tx,p.ty);
  const pool=ZONE_MONS[zone]||ZONE_MONS.forest;
  const key=pool[Math.floor(Math.random()*pool.length)];
  startCombat(key,false);
}

// ===================== PLAYER MOVEMENT =====================
const MOVE_DUR=140;// ms per tile

function tryMove(dx,dy){
  const p=G.player;
  if(p.moving) return;
  const nx=p.tx+dx,ny=p.ty+dy;
  if(nx<0||ny<0||nx>=MW||ny>=MH) return;
  const tile=G.map[ny][nx];
  // Update dir
  if(dx===1) p.dir=1;else if(dx===-1) p.dir=3;
  else if(dy===-1) p.dir=0;else if(dy===1) p.dir=2;
  if(SOLID.has(tile)){
    // Check if it's a chest to interact
    if(tile===TT.CHEST&&!G.lootedChests.has(ny*MW+nx)){
      lootChest(nx,ny);
    }
    return;
  }
  p.tx=nx;p.ty=ny;
  p.moving=true;p.moveTick=MOVE_DUR;
  p.animF=(p.animF+1)%4;
  G.steps++;
}

function updateMovement(dt){
  const p=G.player;
  const targetX=p.tx*TILE+TILE/2,targetY=p.ty*TILE+TILE/2;
  if(p.moving){
    p.moveTick-=dt;
    const frac=Math.max(0,1-p.moveTick/MOVE_DUR);
    const prevX=p.px,prevY=p.py;
    p.px=prevX+(targetX-prevX)*Math.min(1,frac*3);// lerp
    p.py=prevY+(targetY-prevY)*Math.min(1,frac*3);
    if(p.moveTick<=0){
      p.px=targetX;p.py=targetY;p.moving=false;
      checkBossTrigger();
      if(G.state==='explore') tryEncounter();
    }
  } else {
    p.px=targetX;p.py=targetY;
  }
}

// ===================== INPUT =====================
const keys={};
let keyRepeatTimer=0,keyRepeatDir=null;

window.addEventListener('keydown',e=>{
  keys[e.key]=true;
  const k=e.key;

  if(G.state==='gameover'){if(k===' '||k==='Enter'){respawn();}return;}
  if(G.state==='victory'){if(k===' '||k==='Enter'){initState();loadGame();G.state='explore';}return;}
  if(G.state==='dialogue'){if(k===' '||k==='Enter'){advanceDialogue();}return;}
  if(G.state==='levelup'){
    const lu=G.lvlup;
    if(k==='ArrowLeft'||k==='q'||k==='Q') lu.sel=Math.max(0,lu.sel-1);
    else if(k==='ArrowRight'||k==='d'||k==='D') lu.sel=Math.min(5,lu.sel+1);
    else if(k==='ArrowUp'||k==='z'||k==='Z') lu.sel=Math.max(0,lu.sel-2);
    else if(k==='ArrowDown'||k==='s'||k==='S') lu.sel=Math.min(5,lu.sel+2);
    else if(k===' '||k==='Enter') applyLevelUp(lu.sel);
    return;
  }
  if(G.state==='inventory'){if(k==='i'||k==='I'||k==='Escape'){G.state='explore';}return;}

  if(G.state==='combat'){
    const cb=G.combat;
    if(cb.phase==='player'){
      if(k==='ArrowLeft'||k==='q'||k==='Q') cb.menuSel=(cb.menuSel-1+4)%4;
      else if(k==='ArrowRight'||k==='d'||k==='D') cb.menuSel=(cb.menuSel+1)%4;
      else if(k==='ArrowUp'||k==='z'||k==='Z') cb.menuSel=(cb.menuSel-2+4)%4;
      else if(k==='ArrowDown'||k==='s'||k==='S') cb.menuSel=(cb.menuSel+2)%4;
      else if(k===' '||k==='Enter'){
        const actions=['attack','skills','items','run'];
        const act=actions[cb.menuSel];
        if(act==='skills'){cb.phase='skill_menu';cb.skillSel=0;}
        else if(act==='items'){cb.phase='item_menu';cb.itemSel=0;}
        else combatPlayerAction(act);
      }
    } else if(cb.phase==='skill_menu'){
      const skills=getPlayerSkills();
      if(k==='ArrowLeft'||k==='q'||k==='Q') cb.skillSel=(cb.skillSel-1+skills.length)%skills.length;
      else if(k==='ArrowRight'||k==='d'||k==='D') cb.skillSel=(cb.skillSel+1)%skills.length;
      else if(k==='ArrowUp'||k==='z'||k==='Z') cb.skillSel=Math.max(0,cb.skillSel-2);
      else if(k==='ArrowDown'||k==='s'||k==='S') cb.skillSel=Math.min(skills.length-1,cb.skillSel+2);
      else if(k===' '||k==='Enter') combatPlayerAction('skill');
      else if(k==='Escape'||k==='b'||k==='B'){cb.phase='player';}
    } else if(cb.phase==='item_menu'){
      const items=G.player.items.filter(i=>i.qty>0);
      if(k==='ArrowUp'||k==='z'||k==='Z') cb.itemSel=Math.max(0,cb.itemSel-1);
      else if(k==='ArrowDown'||k==='s'||k==='S') cb.itemSel=Math.min(items.length-1,cb.itemSel+1);
      else if(k===' '||k==='Enter') combatPlayerAction('item');
      else if(k==='Escape'||k==='b'||k==='B'){cb.phase='player';}
    }
    return;
  }

  if(G.state==='explore'){
    if(k==='i'||k==='I'){G.state='inventory';return;}
    if(k===' '||k==='Enter'){interact();return;}
    handleMoveKey(k);
  }
  e.preventDefault();
});

window.addEventListener('keyup',e=>{keys[e.key]=false;if(keyRepeatDir===e.key)keyRepeatDir=null;});

function handleMoveKey(k){
  if(k==='ArrowUp'||k==='z'||k==='Z') tryMove(0,-1);
  else if(k==='ArrowDown'||k==='s'||k==='S') tryMove(0,1);
  else if(k==='ArrowLeft'||k==='q'||k==='Q') tryMove(-1,0);
  else if(k==='ArrowRight'||k==='d'||k==='D') tryMove(1,0);
}

// Key hold for smooth movement
let moveHoldTimer=0,moveHoldDir=null;
function updateHeldKeys(dt){
  if(G.state!=='explore'||G.player.moving) return;
  const dirs=[
    {keys:['ArrowUp','z','Z'],dx:0,dy:-1},
    {keys:['ArrowDown','s','S'],dx:0,dy:1},
    {keys:['ArrowLeft','q','Q'],dx:-1,dy:0},
    {keys:['ArrowRight','d','D'],dx:1,dy:0},
  ];
  for(const d of dirs){
    if(d.keys.some(k=>keys[k])){
      moveHoldTimer+=dt;
      if(moveHoldTimer>200){
        tryMove(d.dx,d.dy);moveHoldTimer=0;
      }
      return;
    }
  }
  moveHoldTimer=0;
}

// ===================== TOUCH CONTROLS =====================
function setupTouch(){
  const btns={
    'btn-u':{dx:0,dy:-1},'btn-d':{dx:0,dy:1},
    'btn-l':{dx:-1,dy:0},'btn-r':{dx:1,dy:0},
  };
  Object.entries(btns).forEach(([id,dir])=>{
    const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{e.preventDefault();if(G.state==='explore')tryMove(dir.dx,dir.dy);},{passive:false});
    el.addEventListener('mousedown',()=>{if(G.state==='explore')tryMove(dir.dx,dir.dy);});
  });
  document.getElementById('btn-action').addEventListener('touchstart',e=>{
    e.preventDefault();
    if(G.state==='dialogue') advanceDialogue();
    else if(G.state==='explore') interact();
    else if(G.state==='combat'){
      const cb=G.combat;
      if(cb&&cb.phase==='player') combatPlayerAction(['attack','skills','items','run'][cb.menuSel]);
    } else if(G.state==='gameover') respawn();
    else if(G.state==='levelup') applyLevelUp(G.lvlup.sel);
  },{passive:false});
}

// ===================== RESPAWN =====================
function respawn(){
  const p=G.player;
  p.gold=Math.floor(p.gold/2);
  p.hp=Math.floor(p.maxHp*0.5);p.mp=Math.floor(p.maxMp*0.7);
  p.tx=10;p.ty=4;p.px=10*TILE+TILE/2;p.py=4*TILE+TILE/2;
  p.buffs=[];
  G.combat=null;G.state='explore';
  G.flash={msg:'Vous réapparaissez... avec moitié moins d\'or.',timer:120};
  saveGame();
}

// ===================== AUDIO (Web Audio API) =====================
const SFX=(()=>{
  let AC=null;
  const init=()=>{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();};
  const osc=(freq,type,vol,dur,startT)=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,startT);
    g.gain.setValueAtTime(vol,startT);g.gain.exponentialRampToValueAtTime(0.001,startT+dur);
    o.connect(g);g.connect(AC.destination);
    o.start(startT);o.stop(startT+dur);
  };
  return{
    encounter(){init();const t=AC.currentTime;osc(120,'sawtooth',0.3,0.1,t);osc(180,'sawtooth',0.3,0.15,t+0.1);osc(240,'sawtooth',0.3,0.2,t+0.25);},
    attack(){init();const t=AC.currentTime;osc(300,'square',0.2,0.05,t);osc(150,'sawtooth',0.3,0.1,t+0.05);},
    hit(){init();const t=AC.currentTime;osc(80,'sawtooth',0.4,0.12,t);osc(60,'square',0.2,0.08,t+0.05);},
    heal(){init();const t=AC.currentTime;osc(523,'sine',0.15,0.1,t);osc(659,'sine',0.15,0.1,t+0.1);osc(784,'sine',0.2,0.15,t+0.2);},
    chest(){init();const t=AC.currentTime;osc(523,'sine',0.2,0.1,t);osc(659,'sine',0.2,0.1,t+0.12);osc(880,'sine',0.25,0.2,t+0.24);},
    levelUp(){init();const t=AC.currentTime;[523,659,784,1047].forEach((f,i)=>osc(f,'sine',0.2,0.15,t+i*0.1));},
    victory(){init();const t=AC.currentTime;[262,330,392,523].forEach((f,i)=>osc(f,'sine',0.25,0.3,t+i*0.15));},
    die(){init();const t=AC.currentTime;osc(200,'sawtooth',0.3,0.1,t);osc(150,'sawtooth',0.3,0.15,t+0.1);osc(100,'sawtooth',0.3,0.3,t+0.25);},
    step(){init();const t=AC.currentTime;osc(80,'square',0.05,0.04,t);},
  };
})();

// Init audio on first interaction
document.addEventListener('click',()=>{SFX.encounter&&null;},{once:true});
document.addEventListener('keydown',()=>{},{once:true,capture:true});

// ===================== SAVE / LOAD =====================
const SAVE_KEY='eldenrpg_v2';
function saveGame(){
  const s={
    player:G.player,
    lootedChests:[...G.lootedChests],
    defeatedBosses:[...G.defeatedBosses],
  };
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(s));}catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const s=JSON.parse(raw);
    // Restore player (merge to keep new fields)
    Object.assign(G.player,s.player);
    // Restore weapon object reference
    const wId=G.player.weapon?.id;
    if(wId){const w=WEAPONS.find(x=>x.id===wId);if(w)G.player.weapon=w;}
    G.lootedChests=new Set(s.lootedChests||[]);
    G.defeatedBosses=new Set(s.defeatedBosses||[]);
    // Ensure pixel pos matches tile pos
    G.player.px=G.player.tx*TILE+TILE/2;
    G.player.py=G.player.ty*TILE+TILE/2;
    G.player.moving=false;G.player.buffs=G.player.buffs||[];
  }catch(e){console.warn('Save load failed',e);}
}

// ===================== UPDATE =====================
let lastTs=0;
function update(ts){
  const dt=Math.min(50,ts-lastTs);lastTs=ts;

  if(G.state==='explore'){
    updateMovement(dt);
    updateHeldKeys(dt);
    updateCamera();
    // Auto-save every 30s
    if(Math.floor(ts/30000)!==Math.floor((ts-dt)/30000)) saveGame();
  }
}

// ===================== RENDER =====================
function render(ts){
  ctx.clearRect(0,0,W,H);
  switch(G.state){
    case 'explore': renderExplore();break;
    case 'combat':  renderCombat();break;
    case 'dialogue':renderExplore();renderDialogue();break;
    case 'levelup': renderLevelUp();break;
    case 'gameover':renderGameOver();break;
    case 'victory': renderVictory();break;
    case 'inventory':renderInventory();break;
  }
}

// ===================== MAIN LOOP =====================
function loop(ts){
  update(ts);render(ts);
  requestAnimationFrame(loop);
}

// ===================== INIT =====================
initState();
loadGame();
setupTouch();
// Show intro dialogue
openDialogue([
  {spk:'Système',txt:'Bienvenue dans Tarnished Quest. ZQSD ou Flèches pour vous déplacer. ESPACE pour interagir. I pour l\'inventaire.'},
  {spk:'Système',txt:'Explorez la carte, combattez des monstres, montez de niveau, et trouvez des armes dans les coffres cachés.'},
  {spk:'Système',txt:'Les zones dangereuses sont marquées en sombre. Les boss vous attendent au fond de chaque zone. Bonne chance.'},
]);
requestAnimationFrame(loop);
</script>
